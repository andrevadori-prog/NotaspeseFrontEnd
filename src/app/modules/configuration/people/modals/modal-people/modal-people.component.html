<form nz-form [formGroup]="peopleForm" nzLayout="vertical" (ngSubmit)="onSubmit()">
    <nz-form-item>
        <nz-form-label nzFor="people-name" nzRequired>
            Nome
        </nz-form-label>

        <nz-form-control nzErrorTip="Inserisci un nome di massimo 50 caratteri">
            <input nz-input id="people-name" formControlName="name" />
        </nz-form-control>
    </nz-form-item>

    <nz-form-item>
        <nz-form-label nzFor="people-surname" nzRequired>
            Cognome
        </nz-form-label>

        <nz-form-control nzErrorTip="Inserisci un cognome di massimo 50 caratteri">
            <input nz-input id="people-surname" formControlName="surname" />
        </nz-form-control>
    </nz-form-item>

    <nz-form-item>
        <nz-form-label nzFor="people-badge">Badge</nz-form-label>

        <nz-form-control nzErrorTip="Il badge può contenere al massimo 50 caratteri">
            <input nz-input id="people-badge" formControlName="badge" />
        </nz-form-control>
    </nz-form-item>

    <nz-form-item>
        <nz-form-label nzFor="people-user">
            Nome utente
        </nz-form-label>

        <nz-form-control>
            <nz-select nzId="people-user" formControlName="userId" nzPlaceHolder="Seleziona un account" nzShowSearch
                nzAllowClear>
                @for (user of userList; track user.userId) {
                <nz-option [nzValue]="user.userId" [nzLabel]="user.userName"></nz-option>
                }
            </nz-select>
        </nz-form-control>
    </nz-form-item>

    <nz-form-item>
        <nz-form-label nzFor="people-active" nzRequired>
            Stato
        </nz-form-label>

        <nz-form-control>
            <nz-select nzId="people-active" formControlName="active">
                <nz-option [nzValue]="ConfigEnableMode.Enabled" nzLabel="Abilitato"></nz-option>

                <nz-option [nzValue]="ConfigEnableMode.Disabled" nzLabel="Disabilitato"></nz-option>
            </nz-select>
        </nz-form-control>
    </nz-form-item>

    @if (errore) {
    <p role="alert">{{ errore }}</p>
    }

    <div class="modal-actions">
        <button nz-button type="button" [disabled]="salvataggio" (click)="onCancel()">
            {{ solaLettura ? 'Chiudi' : 'Annulla' }}
        </button>

        @if (!solaLettura) {
        <button nz-button nzType="primary" type="submit" [nzLoading]="salvataggio" [disabled]="salvataggio">
            Salva
        </button>
        }
    </div>
</form>
